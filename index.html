<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Quiz</title>
  <link rel="shortcut icon" href="/public/javascript.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>

<body>
  <div class="quiz-box">
    <div id="quiz-welcome">
      <h2>WELCOME TO THE JAVASCRIPT QUIZ</h2>
      <p>Test your JavaScript knowledge with 20 random questions!</p>
      <button id="start-quiz">START QUIZ</button>
    </div>
    <div id="quiz-container" class="hidden">
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span id="progress-text">1 / 20</span>
      </div>
      <h2 id="question">QUESTION</h2>

      <div class="option-box">
        <button class="option" data-index="0">Option 1</button>
        <button class="option" data-index="1">Option 2</button>
        <button class="option" data-index="2">Option 3</button>
        <button class="option" data-index="3">Option 4</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div id="score-box" class="hidden">
      <h2>Your Score: <span id="final-score">0</span> / <span id="total-questions">20</span></h2>
      <p id="score-message"></p>
      <button id="restart">Restart Quiz</button>
    </div>
  </div>
  <script src="src/questions.js"></script>
  <script src="src/main.js"></script>
</body>

</html>
